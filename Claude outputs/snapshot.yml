name: Snapshot sponsor register

# The register is republished on most working days and there is no official
# archive. This runs every morning and commits whatever changed.
on:
  schedule:
    - cron: "30 7 * * *"   # 07:30 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pandas

      - name: Fetch register
        id: fetch
        run: python snapshot/fetch_register.py
        working-directory: ${{ github.workspace }}

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "register snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
